name: SCPA Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PYTHONIOENCODING: utf-8
  SBERT_FORCE_FALLBACK: "1"
  SBERT_ENABLE_TRANSFORMER: "0"
  JWT_SECRET: ci-test-secret-key-32-bytes-long!
  JWT_REFRESH_SECRET: ci-test-refresh-secret-32bytes!!
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ci_test_password
  POSTGRES_DB: postgres
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  SCPA_TEST_DB: db_scpa_test
  DATABASE_URL: postgresql+psycopg2://postgres:ci_test_password@localhost:5432/postgres
  GATEWAY_DATABASE_URL: postgresql+asyncpg://postgres:ci_test_password@localhost:5432/postgres

jobs:
  backend-verification:
    name: Backend install, migrations, and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-*.txt
            services/*/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Import and compile check
        run: python scripts/verify_project.py --only import compile

      - name: Prepare test database
        run: python scripts/_ensure_test_db.py

      - name: Run Alembic migrations
        run: python -m alembic -c alembic.ini upgrade head

      - name: Run backend tests
        run: python -m pytest -q

  frontend-verification:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
